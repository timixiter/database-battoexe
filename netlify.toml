[build]
  command = "npm install --production"   # Install dependencies
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Redirect semua /api/* ke function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback: semua request ke dashboard.html (SPA style)
[[redirects]]
  from = "/*"
  to = "/dashboard.html"
  status = 200

# CORS Headers untuk API
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
